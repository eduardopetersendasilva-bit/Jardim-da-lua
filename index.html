<!DOCTYPE html>
 <html lang="pt-BR">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Jardim da Lua 🌙</title>
     <link rel="stylesheet" href="style.css">
 </head>
 <body>
 <header>
     <h1>🌙 Jardim da Lua</h1>
     <button onclick="modoDiscreto()" class="btn-discreto">🔒</button>
 </header>
 <main>
     <section class="alerta">
         <h2>🚨 Botão de Emergência</h2>
         <button onclick="enviarAlerta()" id="btnAlerta">ENVIAR ALERTA</button>
     </section>
     <section class="palavra">
         <h2>🔑 Palavra-chave</h2>
         <input type="text" id="palavraChave" placeholder="Digite a palavra...">
         <button onclick="verificarPalavra()">Confirmar</button>
     </section>
 </main>

 </html>
