<!DOCTYPE html>
 <html lang="pt-BR">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Jardim da Lua</title>
     <link rel="stylesheet" href="style.css">
 </head>
 <body>
 <button id="botaoDiscreto" onclick="modoDiscreto()">⚡</button>
 <header>
     <h1>🌙 Jardim da Lua</h1>
     <p>Seu escudo, sua história. Juntas, somos mais fortes.</p>
 </header>
 <section>
     <button id="botaoEmergencia" onclick="enviarAlerta()">
         🚨 BOTÃO DE EMERGÊNCIA
     </button>
     <p>Toque para enviar sua localização às pessoas de confiança</p>
 </section>
 <section>
     <h2>🔒 Palavra-chave</h2>
     <p>Defina uma palavra secreta para acionar o alerta:</p>
     <input type="text" id="palavraChave" placeholder="Digite sua palavra...">
     <button onclick="verificarPalavra()">Confirmar Palavra</button>
 </section>
 <section>
     <h2>📍 Contatos de Apoio</h2>
     <p><strong>190 — Polícia</strong> (Emergência)</p>
     <p><strong>180 — Central da Mulher</strong> (Denúncia 24h)</p>
 </section>
 <script src="script.js"></script>
 </body>
 </html>
